name: iOS TestFlight

# Trigger:
#   - Manually from the Actions tab (workflow_dispatch)
#   - Automatically when you push a version tag like v1.0.0
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Only run one TestFlight upload at a time; cancel superseded runs.
concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-upload:
    name: Build & upload to TestFlight
    runs-on: macos-14
    timeout-minutes: 45

    env:
      # --- App Store Connect API key auth ---
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
      # --- Team / identifiers ---
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_IDENTIFIER: ${{ secrets.APP_IDENTIFIER }}
      # --- Code signing material ---
      DIST_CERT_BASE64: ${{ secrets.DIST_CERT_BASE64 }}
      DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
      PROV_PROFILE_BASE64: ${{ secrets.PROV_PROFILE_BASE64 }}
      # Use the workflow run number as the build number so each upload is unique.
      BUILD_NUMBER: ${{ github.run_number }}
      # Keep fastlane output quiet and non-interactive.
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build web assets (www/)
        run: npm run build

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Ensure CocoaPods & fastlane are available
        # The macos-14 runner ships with CocoaPods and fastlane preinstalled.
        # Verify them, and install only if missing.
        run: |
          set -e
          if ! command -v pod >/dev/null 2>&1; then
            echo "CocoaPods not found; installing…"
            gem install cocoapods --no-document
          fi
          if ! command -v fastlane >/dev/null 2>&1; then
            echo "fastlane not found; installing…"
            gem install fastlane --no-document
          fi
          pod --version
          fastlane --version

      - name: Generate native iOS project (Capacitor)
        # We don't commit ios/ — regenerate it fresh each build.
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Build & upload to TestFlight (fastlane)
        run: fastlane beta
